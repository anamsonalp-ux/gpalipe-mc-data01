<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibson Palipe Advanced Voter Database - Real-Time</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-bottom: 2px solid #e0e0e0;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
            font-size: 0.9em;
        }

        .controls {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
        }

        select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            background: white;
            cursor: pointer;
        }

        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        button.secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        button.secondary:hover {
            background: #e0e0e0;
        }

        .content {
            padding: 20px;
        }

        .voters-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }

        .voters-table th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .voters-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .voters-table tr:hover {
            background: #f9f9f9;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-badge.supporter {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.undecided {
            background: #fff3cd;
            color: #856404;
        }

        .status-badge.opposed {
            background: #f8d7da;
            color: #721c24;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .sync-status {
            padding: 10px 15px;
            background: #d4edda;
            color: #155724;
            border-radius: 5px;
            font-size: 0.9em;
            margin-right: 10px;
        }

        .sync-status.offline {
            background: #f8d7da;
            color: #721c24;
        }

        .sync-status.syncing {
            background: #fff3cd;
            color: #856404;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }

            .search-box {
                min-width: auto;
            }

            .voters-table {
                font-size: 0.85em;
            }

            .voters-table td, .voters-table th {
                padding: 8px;
            }

            .header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Gibson Palipe Voter Database</h1>
            <p>Mendi Central Open - Real-Time Voter Management System</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3 id="totalVoters">0</h3>
                <p>Total Voters</p>
            </div>
            <div class="stat-card">
                <h3 id="supporters">0</h3>
                <p>Supporters</p>
            </div>
            <div class="stat-card">
                <h3 id="undecided">0</h3>
                <p>Undecided</p>
            </div>
            <div class="stat-card">
                <h3 id="opposed">0</h3>
                <p>Opposed</p>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search by voter name...">
            </div>
            <select id="wardFilter">
                <option value="">All Wards</option>
            </select>
            <select id="statusFilter">
                <option value="">All Status</option>
                <option value="Voter1">Voter1</option>
                <option value="Voter2">Voter2</option>
                <option value="Voter3">Voter3</option>
            </select>
            <button onclick="openAddVoterModal()">➕ Add Voter</button>
            <button class="secondary" onclick="exportCSV()">📥 Export CSV</button>
            <div class="sync-status" id="syncStatus">✓ Ready</div>
        </div>

        <div class="content">
            <div id="loadingMessage" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading voter database...</p>
            </div>
            <table class="voters-table" id="votersTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Ward</th>
                        <th>Village</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="votersBody">
                </tbody>
            </table>
            <div class="no-data" id="noDataMessage" style="display: none;">
                No voters found. <button onclick="openAddVoterModal()">Add your first voter</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Voter Modal -->
    <div class="modal" id="voterModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New Voter</h2>
            <form id="voterForm">
                <div class="form-group">
                    <label for="voterName">Full Name *</label>
                    <input type="text" id="voterName" required>
                </div>
                <div class="form-group">
                    <label for="voterPhone">Phone</label>
                    <input type="tel" id="voterPhone">
                </div>
                <div class="form-group">
                    <label for="voterWard">Ward *</label>
                    <select id="voterWard" required>
                        <option value="">Select Ward</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="voterVillage">Village</label>
                    <input type="text" id="voterVillage">
                </div>
                <div class="form-group">
                    <label for="voterStatus">Status</label>
                    <select id="voterStatus">
                        <option value="Undecided">Undecided</option>
                        <option value="Supporter">Supporter</option>
                        <option value="Opposed">Opposed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="voterNotes">Notes</label>
                    <textarea id="voterNotes"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit">Save Voter</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://twtabchsgjgqnihbhbue.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3dGFiY2hzZ2pncW5paGJoYnVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjM0OTIxMDAsImV4cCI6MjAzOTA2ODEwMH0.nG5vAYz-z7vMhY4KdPKYXnMhVvEhH9c7v5rG5w4vQXA';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let voters = [];
        let filteredVoters = [];
        let wards = new Set();
        let editingId = null;

        // Initialize
        async function init() {
            try {
                // Populate ward options
                const uniqueWards = [
                    'KiburuBox A', 'KiburuBox B', 'Kiburu Box C - Oiyarip', 'Pinj 1', 'Pinj 2',
                    'Tubiri', 'Eskampe (Tepe)', 'Una-Kos1', 'Endawa (Kos 2)', 'Teta',
                    'Mendi Urban Ward1', 'Mendi Urban Ward3', 'Yaken', 'Yebi 2A', 'Yebi 2B',
                    'Yebi 1', 'Umbiala Pundia', 'Tutam Lumbi Box A Lumbi', 'Tutam Lumbi B Tutam',
                    'Bui Ebi CIS', 'Polomanda Unjamap', 'Tente Ward 1 6mile', 'Urban ward 2 YC-Magani',
                    'Tente Ward 2 (5mile)', 'Yaria', 'Sumia Ward 1', 'Sumia Ward 2', 'Onne',
                    'Longo Kave Box A', 'Longo Kave Box B', 'Porolo Box A', 'Porolo Box B',
                    'Asisa 2 Papera', 'Ibia', 'Sumia Ward 4', 'Yameriga', 'Umbimi',
                    'Wakwak Box A', 'Wakwak Box B'
                ];

                uniqueWards.forEach(ward => {
                    const option = document.createElement('option');
                    option.value = ward;
                    option.textContent = ward;
                    document.getElementById('voterWard').appendChild(option);
                    document.getElementById('wardFilter').appendChild(option.cloneNode(true));
                });

                // Ensure table exists
                try {
                    const { error: tableError } = await supabase.from('voters').select('count');
                    if (tableError && tableError.code === 'PGRST116') {
                        console.log('Creating voters table...');
                        // Table will be created by Supabase SQL migration
                    }
                } catch (err) {
                    console.log('Table check:', err);
                }

                // Load initial data
                await loadVoters();

                // Set up real-time listener
                setupRealtimeListener();

                // Setup filters
                document.getElementById('searchInput').addEventListener('input', filterVoters);
                document.getElementById('wardFilter').addEventListener('change', filterVoters);
                document.getElementById('statusFilter').addEventListener('change', filterVoters);

            } catch (error) {
                console.error('Init error:', error);
                updateSyncStatus('offline');
            }
        }

        async function loadVoters() {
            try {
                document.getElementById('loadingMessage').style.display = 'block';
                document.getElementById('votersTable').style.display = 'none';

                const { data, error } = await supabase
                    .from('voters')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('Load error:', error);
                    throw error;
                }

                voters = data || [];
                filterVoters();
                updateStats();
                updateSyncStatus('ready');
            } catch (error) {
                console.error('Error loading voters:', error);
                updateSyncStatus('offline');
                // Try loading from localStorage as fallback
                loadVotersFromLocalStorage();
            } finally {
                document.getElementById('loadingMessage').style.display = 'none';
            }
        }

        function setupRealtimeListener() {
            supabase.channel('voters_channel')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'voters' },
                    (payload) => {
                        console.log('Real-time update:', payload);
                        loadVoters();
                    }
                )
                .subscribe();
        }

        function filterVoters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const wardFilter = document.getElementById('wardFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            filteredVoters = voters.filter(voter => {
                const nameMatch = !searchTerm || (voter.full_name || '').toLowerCase().includes(searchTerm);
                const wardMatch = !wardFilter || (voter.ward || '') === wardFilter;
                const statusMatch = !statusFilter || (voter.support_status || '') === statusFilter;

                return nameMatch && wardMatch && statusMatch;
            });

            renderVoters();
        }

        function renderVoters() {
            const tbody = document.getElementById('votersBody');
            const table = document.getElementById('votersTable');
            const noData = document.getElementById('noDataMessage');

            tbody.innerHTML = '';

            if (filteredVoters.length === 0) {
                table.style.display = 'none';
                noData.style.display = 'block';
                return;
            }

            table.style.display = 'table';
            noData.style.display = 'none';

            filteredVoters.forEach(voter => {
                const row = document.createElement('tr');
                const statusClass = (voter.support_status || 'Undecided').toLowerCase();

                row.innerHTML = `
                    <td>${voter.full_name || 'N/A'}</td>
                    <td>${voter.phone || 'N/A'}</td>
                    <td>${voter.ward || 'N/A'}</td>
                    <td>${voter.village || 'N/A'}</td>
                    <td><span class="status-badge ${statusClass}">${voter.support_status || 'Undecided'}</span></td>
                    <td>
                        <button class="secondary" style="font-size: 0.85em; padding: 5px 10px;" onclick="editVoter(${voter.id})">Edit</button>
                        <button class="secondary" style="font-size: 0.85em; padding: 5px 10px; background: #f8d7da;" onclick="deleteVoter(${voter.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateStats() {
            const totalVoters = voters.length;
            const supporters = voters.filter(v => v.support_status === 'Supporter').length;
            const undecided = voters.filter(v => v.support_status === 'Undecided' || !v.support_status).length;
            const opposed = voters.filter(v => v.support_status === 'Opposed').length;

            document.getElementById('totalVoters').textContent = totalVoters;
            document.getElementById('supporters').textContent = supporters;
            document.getElementById('undecided').textContent = undecided;
            document.getElementById('opposed').textContent = opposed;
        }

        function openAddVoterModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add New Voter';
            document.getElementById('voterForm').reset();
            document.getElementById('voterModal').classList.add('active');
        }

        async function editVoter(id) {
            const voter = voters.find(v => v.id === id);
            if (!voter) return;

            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Voter';
            document.getElementById('voterName').value = voter.full_name || '';
            document.getElementById('voterPhone').value = voter.phone || '';
            document.getElementById('voterWard').value = voter.ward || '';
            document.getElementById('voterVillage').value = voter.village || '';
            document.getElementById('voterStatus').value = voter.support_status || 'Undecided';
            document.getElementById('voterNotes').value = voter.notes || '';
            document.getElementById('voterModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('voterModal').classList.remove('active');
            editingId = null;
        }

        document.getElementById('voterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            updateSyncStatus('syncing');

            const voterData = {
                full_name: document.getElementById('voterName').value,
                phone: document.getElementById('voterPhone').value,
                ward: document.getElementById('voterWard').value,
                village: document.getElementById('voterVillage').value,
                support_status: document.getElementById('voterStatus').value,
                notes: document.getElementById('voterNotes').value,
                updated_at: new Date().toISOString()
            };

            try {
                if (editingId) {
                    const { error } = await supabase
                        .from('voters')
                        .update(voterData)
                        .eq('id', editingId);

                    if (error) throw error;
                } else {
                    const { error } = await supabase
                        .from('voters')
                        .insert([{
                            ...voterData,
                            created_at: new Date().toISOString()
                        }]);

                    if (error) throw error;
                }

                closeModal();
                await loadVoters();
            } catch (error) {
                console.error('Save error:', error);
                alert('Error saving voter: ' + error.message);
                updateSyncStatus('offline');
            }
        });

        async function deleteVoter(id) {
            if (!confirm('Are you sure you want to delete this voter?')) return;

            try {
                updateSyncStatus('syncing');
                const { error } = await supabase
                    .from('voters')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                await loadVoters();
            } catch (error) {
                console.error('Delete error:', error);
                alert('Error deleting voter: ' + error.message);
                updateSyncStatus('offline');
            }
        }

        function exportCSV() {
            if (filteredVoters.length === 0) {
                alert('No voters to export');
                return;
            }

            const headers = ['Full Name', 'Phone', 'Ward', 'Village', 'Status', 'Notes'];
            const rows = filteredVoters.map(v => [
                v.full_name || '',
                v.phone || '',
                v.ward || '',
                v.village || '',
                v.support_status || '',
                v.notes || ''
            ]);

            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(cell => `"${(cell || '').replace(/"/g, '""')}"`).join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `voters_export_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }

        function updateSyncStatus(status) {
            const statusEl = document.getElementById('syncStatus');
            if (status === 'ready') {
                statusEl.textContent = '✓ Synced';
                statusEl.classList.remove('offline', 'syncing');
            } else if (status === 'syncing') {
                statusEl.textContent = '⟳ Syncing...';
                statusEl.classList.add('syncing');
                statusEl.classList.remove('offline');
            } else if (status === 'offline') {
                statusEl.textContent = '✗ Offline Mode';
                statusEl.classList.add('offline');
                statusEl.classList.remove('syncing');
            }
        }

        function loadVotersFromLocalStorage() {
            try {
                const stored = localStorage.getItem('votersBackup');
                if (stored) {
                    voters = JSON.parse(stored);
                    filterVoters();
                    updateStats();
                }
            } catch (err) {
                console.error('LocalStorage load error:', err);
            }
        }

        // Save to localStorage as backup
        function saveToLocalStorage() {
            localStorage.setItem('votersBackup', JSON.stringify(voters));
        }

    event.preventDefault();

    // 1. Create the voter object from form fields
    const newVoter = {
        id: currentEditId || 'voter_' + Date.now(), // Keep ID if editing, else new
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        age: document.getElementById('age').value,
        gender: document.getElementById('gender').value,
        occupation: document.getElementById('occupation').value,
        status: document.getElementById('status').value,
        ward: document.getElementById('ward').value,
        village: document.getElementById('village').value,
        // Make sure these match your Supabase column names!
        lastVisit: new Date().toISOString().split('T')[0],
        dateAdded: currentEditId ? undefined : new Date().toISOString().split('T')[0]
    };

    console.log('Saving to Supabase...', newVoter);

    // 2. Send data to Supabase
    const { data, error } = await supabase
        .from('voters')
        .upsert([newVoter]); // upsert inserts new OR updates existing

    if (error) {
        console.error('Supabase Save Error:', error);
        alert('Failed to save: ' + error.message);
    } else {
        alert('Voter saved to Supabase!');
        closeVoterForm();
        fetchVoters(); // Refresh the list automatically
    }
}
        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
